<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Innovation & Incubation MCQ Practice</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
<style>
:root {
  --bg: #f6f7f9;
  --card: #ffffff;
  --card-hover: #fafbfc;
  --ink: #1c2230;
  --mute: #6b7385;
  --line: #e1e4ea;
  --accent: #2563eb;
  --accent-hover: #1d4ed8;
  --accent-soft: rgba(37, 99, 235, 0.08);
  --ok: #16a34a;
  --okbg: #e6f7ec;
  --okborder: #86efac;
  --bad: #dc2626;
  --badbg: #fef2f2;
  --badborder: #fca5a5;
  --warn: #d97706;
  --warnbg: #fffbeb;
  --warnborder: #fcd34d;
  --star: #f59e0b;
  --shadow: 0 4px 14px rgba(0,0,0,0.05);
  --radius: 12px;
}

[data-theme="dark"] {
  --bg: #111827;
  --card: #1f2937;
  --card-hover: #283548;
  --ink: #f3f4f6;
  --mute: #9ca3af;
  --line: #374151;
  --accent: #60a5fa;
  --accent-hover: #3b82f6;
  --accent-soft: rgba(96, 165, 250, 0.14);
  --ok: #4ade80;
  --okbg: #143522;
  --okborder: #1e5a34;
  --bad: #f87171;
  --badbg: #3c1a1e;
  --badborder: #6d252b;
  --warn: #fbbf24;
  --warnbg: #382910;
  --warnborder: #855d14;
  --star: #fbbf24;
  --shadow: 0 4px 14px rgba(0,0,0,0.25);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111827;
    --card: #1f2937;
    --card-hover: #283548;
    --ink: #f3f4f6;
    --mute: #9ca3af;
    --line: #374151;
    --accent: #60a5fa;
    --accent-hover: #3b82f6;
    --accent-soft: rgba(96, 165, 250, 0.14);
    --ok: #4ade80;
    --okbg: #143522;
    --okborder: #1e5a34;
    --bad: #f87171;
    --badbg: #3c1a1e;
    --badborder: #6d252b;
    --warn: #fbbf24;
    --warnbg: #382910;
    --warnborder: #855d14;
    --star: #fbbf24;
    --shadow: 0 4px 14px rgba(0,0,0,0.25);
  }
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.55 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  transition: background-color 0.2s ease, color 0.2s ease;
  min-height: 100vh;
}

main {
  max-width: 840px;
  margin: 0 auto;
  padding: 24px 18px 80px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  gap: 12px;
  flex-wrap: wrap;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-icon {
  font-size: 30px;
  line-height: 1;
}

h1 {
  font-size: 21px;
  font-weight: 700;
  margin: 0;
  letter-spacing: -0.01em;
}

.subhead {
  font-size: 13px;
  color: var(--mute);
  margin-top: 2px;
}

nav {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
  transition: border-color 0.2s;
}

button {
  font: inherit;
  font-size: 14px;
  cursor: pointer;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  padding: 8px 14px;
  border-radius: 8px;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.15s ease;
}

button:hover {
  border-color: var(--accent);
  background: var(--card-hover);
}

button.primary {
  background: var(--accent);
  color: #ffffff !important;
  border-color: var(--accent);
}

button.primary:hover {
  background: var(--accent-hover);
  border-color: var(--accent-hover);
}

button.danger {
  color: var(--bad);
  border-color: var(--line);
}

button.danger:hover {
  background: var(--badbg);
  border-color: var(--bad);
}

button:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.btn-sm {
  padding: 5px 12px;
  font-size: 13px;
  border-radius: 6px;
}

.nav-btn.active {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: var(--accent);
  font-weight: 600;
}

.badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  padding: 1px 7px;
  border-radius: 12px;
  background: var(--accent);
  color: #fff;
  margin-left: 4px;
}

.badge.warn {
  background: var(--bad);
}

/* Stats */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 12px;
  margin-bottom: 18px;
}

.stat {
  text-align: center;
  padding: 14px 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--card);
  box-shadow: 0 2px 6px rgba(0,0,0,0.02);
}

.stat b {
  display: block;
  font-size: 26px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.2;
}

.stat span {
  color: var(--mute);
  font-size: 13px;
  font-weight: 500;
}

/* Modes Grid */
.modes {
  display: grid;
  gap: 10px;
  margin-top: 14px;
}

.mode {
  display: flex;
  justify-content: space-between;
  align-items: center;
  text-align: left;
  padding: 14px 16px;
  border-radius: 10px;
  width: 100%;
}

.mode div {
  flex: 1;
}

.mode b {
  display: block;
  font-size: 15px;
  margin-bottom: 2px;
}

.mode small {
  color: var(--mute);
  font-size: 13px;
  font-weight: normal;
  display: block;
}

.mode.primary small {
  color: rgba(255, 255, 255, 0.88);
}

/* Question Area */
.meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: var(--mute);
  font-size: 13px;
  margin-bottom: 10px;
  flex-wrap: wrap;
  gap: 6px;
}

.meta-tags {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.bar {
  height: 8px;
  background: var(--line);
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 18px;
}

.bar i {
  display: block;
  height: 100%;
  background: var(--accent);
  transition: width 0.3s ease;
}

.q {
  font-size: 18.5px;
  font-weight: 600;
  line-height: 1.45;
  margin: 6px 0 16px;
  color: var(--ink);
  white-space: pre-wrap;
  word-break: break-word;
}



.opts {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.opt {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  width: 100%;
  text-align: left;
  padding: 13px 16px;
  border-radius: 10px;
  font-size: 15.5px;
  line-height: 1.45;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  transition: all 0.15s ease;
  user-select: none;
}

.opt:hover:not(:disabled) {
  border-color: var(--accent);
  background: var(--accent-soft);
  transform: translateY(-1px);
}

.opt.selected {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: 0 0 0 1px var(--accent);
}

.chkbox {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 19px;
  height: 19px;
  border: 2px solid var(--line);
  border-radius: 5px;
  font-size: 12px;
  font-weight: 700;
  color: transparent;
  background: var(--card);
  margin-top: 1px;
  transition: all 0.15s ease;
  flex-shrink: 0;
}

.opt.selected .chkbox {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.opt .k {
  font-weight: 700;
  color: var(--mute);
  min-width: 22px;
  font-size: 14px;
  padding-top: 1px;
}

.opt .text {
  flex: 1;
}

.opt .icon {
  margin-left: auto;
  font-size: 18px;
  font-weight: 700;
  display: none;
}

.opt.right {
  background: var(--okbg) !important;
  border-color: var(--okborder) !important;
  color: var(--ink) !important;
}

.opt.right .k {
  color: var(--ok) !important;
}

.opt.right .icon {
  display: inline-block;
  color: var(--ok);
}

.opt.wrong {
  background: var(--badbg) !important;
  border-color: var(--badborder) !important;
  color: var(--ink) !important;
}

.opt.wrong .k {
  color: var(--bad) !important;
}

.opt.wrong .icon {
  display: inline-block;
  color: var(--bad);
}

.opt.missed {
  border-color: var(--warnborder) !important;
  background: var(--warnbg) !important;
}

.opt.missed .k {
  color: var(--warn) !important;
}

.opt.missed .icon {
  display: inline-block;
  color: var(--warn);
  font-size: 12px;
  font-weight: 600;
}

.expl {
  margin-top: 16px;
  padding: 14px 16px;
  border-left: 4px solid var(--accent);
  background: var(--accent-soft);
  border-radius: 0 8px 8px 0;
  font-size: 14.5px;
  line-height: 1.5;
}

.expl b {
  color: var(--accent);
  display: block;
  margin-bottom: 4px;
}

.tag {
  display: inline-block;
  font-size: 12px;
  font-weight: 500;
  padding: 2px 9px;
  border-radius: 99px;
  border: 1px solid var(--line);
  color: var(--mute);
}

.tag.topic {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: transparent;
  font-weight: 600;
}

.tag.multi {
  background: var(--warnbg);
  color: var(--warn);
  border-color: var(--warnborder);
  font-weight: 700;
}

.tag.weak {
  color: var(--bad);
  border-color: var(--badborder);
  background: var(--badbg);
}

.tag.ok {
  color: var(--ok);
  border-color: var(--okborder);
  background: var(--okbg);
}

.tag.star {
  color: var(--star);
  border-color: var(--star);
  background: var(--warnbg);
}

.tag.auto {
  color: var(--accent);
  border-color: var(--accent);
  background: var(--accent-soft);
}

/* Auto-Advance Banner */
.auto-advance-bar {
  position: relative;
  background: var(--accent-soft);
  border: 1px solid var(--accent);
  border-radius: 8px;
  overflow: hidden;
  margin-top: 14px;
  padding: 8px 12px;
}

.auto-advance-fill {
  position: absolute;
  top: 0; left: 0; bottom: 0;
  background: rgba(37, 99, 235, 0.18);
  width: 0%;
  pointer-events: none;
}

.auto-advance-content {
  position: relative;
  z-index: 1;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13.5px;
}

/* Tables */
.table-wrap {
  overflow-x: auto;
  margin-top: 12px;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

td, th {
  padding: 10px 8px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: middle;
}

th {
  color: var(--mute);
  font-weight: 600;
  font-size: 13px;
}

tr:hover td {
  background: var(--card-hover);
}

/* Forms */
textarea {
  width: 100%;
  min-height: 220px;
  font: 13px/1.5 Consolas, Monaco, monospace;
  background: var(--bg);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
  resize: vertical;
}

select, input[type="text"], input[type="search"] {
  font: inherit;
  font-size: 14px;
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
}

.row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}

.mute { color: var(--mute); }
.pct { font-weight: 700; color: var(--accent); }

/* Star Button */
.star-btn {
  background: transparent;
  border: none;
  font-size: 20px;
  padding: 4px 6px;
  cursor: pointer;
  color: var(--mute);
  line-height: 1;
  transition: transform 0.15s, color 0.15s;
}

.star-btn:hover {
  transform: scale(1.15);
  color: var(--star);
  background: transparent;
}

.star-btn.starred {
  color: var(--star);
}

/* Toggle Switch */
.toggle-switch {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  font-size: 13px;
  user-select: none;
}

.toggle-switch input {
  display: none;
}

.toggle-track {
  width: 34px;
  height: 20px;
  background: var(--line);
  border-radius: 99px;
  position: relative;
  transition: background-color 0.2s;
}

.toggle-switch input:checked + .toggle-track {
  background: var(--accent);
}

.toggle-thumb {
  width: 14px;
  height: 14px;
  background: #fff;
  border-radius: 50%;
  position: absolute;
  top: 3px;
  left: 3px;
  transition: transform 0.2s;
}

.toggle-switch input:checked + .toggle-track .toggle-thumb {
  transform: translateX(14px);
}

/* Result Card */
.score-circle {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  background: var(--accent-soft);
  border: 4px solid var(--accent);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin: 10px auto 16px;
}

.score-circle .score-num {
  font-size: 28px;
  font-weight: 800;
  color: var(--accent);
  line-height: 1;
}

.score-circle .score-label {
  font-size: 12px;
  color: var(--mute);
  margin-top: 4px;
}

.keyboard-hint {
  font-size: 11.5px;
  color: var(--mute);
  display: flex;
  gap: 12px;
  margin-top: 14px;
  justify-content: center;
  flex-wrap: wrap;
}

.kbd {
  display: inline-block;
  padding: 1px 5px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--card);
  box-shadow: 0 1px 1px rgba(0,0,0,0.1);
  font-family: monospace;
}
</style>
</head>
<body>
<main>
<header>
  <div class="brand">
    <div class="brand-icon">🚀</div>
    <div>
      <h1>Innovation & Incubation MCQ Practice</h1>
      <div class="subhead">Product Design, Incubation & Entrepreneurship • 120 Questions across 12 Assignments</div>
    </div>
  </div>
  <nav>
    <button class="nav-btn" data-go="home">🏠 Home</button>

</header>
<div id="view"></div>
</main>

<script>
const KEY_Q = 'incu.questions.v3';
const KEY_S = 'incu.stats.v3';
const KEY_STARS = 'incu.stars.v1';
const KEY_THEME = 'incu.theme.v1';
const KEY_AUTO = 'incu.auto.v1';
const KEY_DELAY = 'incu.delay.v1';

const DEFAULT_QUESTIONS = [{"id": "incu_asg01_q01", "asg": 1, "q_num": 1, "q": "What makes an idea valuable even if it fails?", "opts": {"A": "Avoiding collaboration to prevent shared blame", "B": "Gaining valuable lessons and insights from the failure", "C": "Shifting focus to unrelated projects immediately", "D": "Disregarding accountability and blaming external factors"}, "ans": ["B"], "ans_text": "Gaining valuable lessons and insights from the failure", "topic": "Assignment 01: Idea Valuation & Lean Startup Fundamentals", "expl": "Correct Answer: B) Gaining valuable lessons and insights from the failure"}, {"id": "incu_asg01_q02", "asg": 1, "q_num": 2, "q": "What are some key characteristics essential for a business to achieve success?", "opts": {"A": "The ability to balance expenses while maintaining product quality", "B": "Ignoring customer feedback to prioritize internal goals", "C": "Strategic planning and adaptability to market changes", "D": "Focusing solely on profit maximization"}, "ans": ["C"], "ans_text": "Strategic planning and adaptability to market changes", "topic": "Assignment 01: Idea Valuation & Lean Startup Fundamentals", "expl": "Correct Answer: C) Strategic planning and adaptability to market changes"}, {"id": "incu_asg01_q03", "asg": 1, "q_num": 3, "q": "What are the primary objectives of selling a product or service, and how do these address customer needs?", "opts": {"A": "Identifying and fulfilling customer and market needs", "B": "Maximizing profits through aggressive pricing strategies", "C": "Focusing on complex promotional campaigns", "D": "Offering discounts to increase sales"}, "ans": ["A"], "ans_text": "Identifying and fulfilling customer and market needs", "topic": "Assignment 01: Idea Valuation & Lean Startup Fundamentals", "expl": "Correct Answer: A) Identifying and fulfilling customer and market needs"}, {"id": "incu_asg01_q04", "asg": 1, "q_num": 4, "q": "What makes an idea “disruptive”?", "opts": {"A": "Maintaining the existing state and avoiding innovation", "B": "Imitating successful competitors to gain market share", "C": "Introducing changes that challenge existing market norms", "D": "Strictly adhering to traditional market standards"}, "ans": ["C"], "ans_text": "Introducing changes that challenge existing market norms", "topic": "Assignment 01: Idea Valuation & Lean Startup Fundamentals", "expl": "Correct Answer: C) Introducing changes that challenge existing market norms"}, {"id": "incu_asg01_q05", "asg": 1, "q_num": 5, "q": "How does entrepreneurship contribute to economic growth?", "opts": {"A": "By developing robust business models without innovation", "B": "By focusing solely on customer validation and discovery", "C": "By identifying and solving market problems effectively", "D": "By avoiding competitive risks through market isolation"}, "ans": ["C"], "ans_text": "By identifying and solving market problems effectively", "topic": "Assignment 01: Idea Valuation & Lean Startup Fundamentals", "expl": "Correct Answer: C) By identifying and solving market problems effectively"}, {"id": "incu_asg01_q06", "asg": 1, "q_num": 6, "q": "What is emphasized in the Lean Startup methodology for product development?", "opts": {"A": "Graduation degrees as a prerequisite for entrepreneurship", "B": "Rigid execution of initial business plans", "C": "Financial optimization over product innovation", "D": "Continuous learning and validation through customer feedback"}, "ans": ["D"], "ans_text": "Continuous learning and validation through customer feedback", "topic": "Assignment 01: Idea Valuation & Lean Startup Fundamentals", "expl": "Correct Answer: D) Continuous learning and validation through customer feedback"}, {"id": "incu_asg01_q07", "asg": 1, "q_num": 7, "q": "What are the key objectives of the Lean Startup methodology when launching a new product or service?", "opts": {"A": "Customer validation and iterative development", "B": "Company building without market analysis", "C": "Rapid scaling and long-term planning", "D": "Agile engineering without customer feedback"}, "ans": ["A"], "ans_text": "Customer validation and iterative development", "topic": "Assignment 01: Idea Valuation & Lean Startup Fundamentals", "expl": "Correct Answer: A) Customer validation and iterative development"}, {"id": "incu_asg01_q08", "asg": 1, "q_num": 8, "q": "How do institutions foster innovation and entrepreneurship effectively?", "opts": {"A": "By connecting academic research to practical applications in the market", "B": "By focusing exclusively on theoretical research", "C": "By isolating themselves from marketplace collaborations", "D": "By discouraging experimentation within the institution"}, "ans": ["A"], "ans_text": "By connecting academic research to practical applications in the market", "topic": "Assignment 01: Idea Valuation & Lean Startup Fundamentals", "expl": "Correct Answer: A) By connecting academic research to practical applications in the market"}, {"id": "incu_asg01_q09", "asg": 1, "q_num": 9, "q": "How can evidence-based entrepreneurship be defined and applied effectively?", "opts": {"A": "By utilizing validated learning through continuous experimentation and data analysis", "B": "By implementing the Build-Measure-Learn cycle to iteratively develop and improve products", "C": "By making decisions based on empirical evidence rather than assumptions", "D": "By regularly engaging with customers to gather feedback and validate ideas"}, "ans": ["A", "B", "C", "D"], "ans_text": "By utilizing validated learning through continuous experimentation and data analysis. By implementing the Build-Measure-Learn cycle to iteratively develop and improve products. By making decisions based on empirical evidence rather than assumptions. By regularly engaging with customers to gather feedback and validate ideas.", "topic": "Assignment 01: Idea Valuation & Lean Startup Fundamentals", "expl": "Correct Answer: A) By utilizing validated learning through continuous experimentation and data analysis; B) By implementing the Build-Measure-Learn cycle to iteratively develop and improve products; C) By making decisions based on empirical evidence rather than assumptions; D) By regularly engaging with customers to gather feedback and validate ideas"}, {"id": "incu_asg01_q10", "asg": 1, "q_num": 10, "q": "What are some common mistakes startups make?", "opts": {"A": "Adopting the Lean Startup methodology", "B": "Focusing too much on the product and neglecting the market", "C": "Developing solutions without engaging potential customers", "D": "Preparing a business plan and estimating market size"}, "ans": ["B", "C"], "ans_text": "Focusing too much on the product and neglecting the market Developing solutions without engaging potential customers", "topic": "Assignment 01: Idea Valuation & Lean Startup Fundamentals", "expl": "Correct Answer: B) Focusing too much on the product and neglecting the market; C) Developing solutions without engaging potential customers"}, {"id": "incu_asg02_q01", "asg": 2, "q_num": 1, "q": "What can be the main reason for the failure of a startup?", "opts": {"A": "No real need for the product or service", "B": "A skilled and experienced team", "C": "Having sufficient investors and funding", "D": "Offering a user-friendly product"}, "ans": ["A"], "ans_text": "No real need for the product or service", "topic": "Assignment 02: Startup Success, Failure & Team Dynamics", "expl": "Correct Answer: A) No real need for the product or service"}, {"id": "incu_asg02_q02", "asg": 2, "q_num": 2, "q": "Which among the following could be a crucial factor in a team’s unity and success?", "opts": {"A": "Individual achievements", "B": "Lack of diversity", "C": "Frequent disagreements", "D": "Shared vision and common ideology"}, "ans": ["D"], "ans_text": "Shared vision and common ideology", "topic": "Assignment 02: Startup Success, Failure & Team Dynamics", "expl": "Correct Answer: D) Shared vision and common ideology"}, {"id": "incu_asg02 nd services without adaptation"}, "ans": ["A"], "ans_text": "a. Understanding the cultural and economic environment", "topic": "Assignment 04: Outside-In Thinking & Sustainable Markets", "expl": "Correct Answer: A) Understanding the cultural and economic environment"}, {"id": "incu_asg04_q09", "asg": 4, "q_num": 9, "q": "How are urgent or active problems identified on the problem recognition scale?", "opts": {"A": "By ignoring the problem entirely", "B": "Recognizing a problem and actively seeking a solution", "C": "Recognizing a problem but refusing to act on it", "D": "Adjusting to the problem without solving it"}, "ans": ["B"], "ans_text": "b. Recognizing a problem and actively seeking a solution", "topic": "Assignment 04: Outside-In Thinking & Sustainable Markets", "expl": "Correct Answer: B) Recognizing a problem and actively seeking a solution"}, {"id": "incu_asg04_q10", "asg": 4, "q_num": 10, "q": "In the passive problem stage, what defines an individual's awareness of a problem on the problem recognition scale?", "opts": {"A": "No awareness of the problem exists", "B": "Awareness of the problem but no motivation to change", "C": "Motivation to change without understanding the problem", "D": "Recognizing the problem but being unable to act on it"}, "ans": ["B"], "ans_text": "b. Awareness of the problem but no motivation to change", "topic": "Assignment 04: Outside-In Thinking & Sustainable Markets", "expl": "Correct Answer: B) Awareness of the problem but no motivation to change"}, {"id": "incu_asg05_q01", "asg": 5, "q_num": 1, "q": "What strategies are crucial for converting academic research into practical societal benefits?", "opts": {"A": "Establishing obstacles to innovation", "B": "Partnering with industries to link research with real-world applications", "C": "Keeping research results confidential", "D": "Engaging in rivalry with industries to demonstrate academic dominance"}, "ans": ["B"], "ans_text": "b. Partnering with industries to link research with real-world applications", "topic": "Assignment 05: Innovation, IPR & Technology Readiness (TRL)", "expl": "Correct Answer: B) Partnering with industries to link research with real-world applications"}, {"id": "incu_asg05_q02", "asg": 5, "q_num": 2, "q": "Why are investors often reluctant to invest in healthcare product startups?", "opts": {"A": "High profit margins in the industry", "B": "Poor success rates of medical devices", "C": "Rapidly growing demand for medical devices", "D": "Shorter research and development cycles"}, "ans": ["B"], "ans_text": "b. Poor success rates of medical devices", "topic": "Assignment 05: Innovation, IPR & Technology Readiness (TRL)", "expl": "Correct Answer: B) Poor success rates of medical devices"}, {"id": "incu_asg05_q03", "asg": 5, "q_num": 3, "q": "What initial step is crucial for developing a successful design solution?", "opts": {"A": "Identifying the problem and understanding functional requirements", "B": "Planning marketing campaigns and advertising strategies", "C": "Conducting employee training and managing resources", "D": "Securing Intellectual Property Rights and patents"}, "ans": ["A"], "ans_text": "a. Identifying the problem and understanding functional requirements", "topic": "Assignment 05: Innovation, IPR & Technology Readiness (TRL)", "expl": "Correct Answer: A) Identifying the problem and understanding functional requirements"}, {"id": "incu_asg05_q04", "asg": 5, "q_num": 4, "q": "What role did telemedicine play in improving healthcare during global pandemics?", "opts": {"A": "Increased healthcare costs without benefits", "B": "Reduced the strain on physical healthcare facilities", "C": "Created barriers for patient access to care", "D": "Complicated the delivery of medical services"}, "ans": ["B"], "ans_text": "b. Reduced the strain on physical healthcare facilities", "topic": "Assignment 05: Innovation, IPR & Technology Readiness (TRL)", "expl": "Correct Answer: B) Reduced the strain on physical healthcare facilities"}, {"id": "incu_asg05_q05", "asg": 5, "q_num": 5, "q": "What is the main purpose of pilot production in the development process?", "opts": {"A": "Generating marketing and advertising content", "B": "Testing and adapting design features based on user feedback", "C": "Filing for patents before large-scale production", "D": "Conducting research in controlled lab environments"}, "ans": ["B"], "ans_text": "b. Testing and adapting design features based on user feedback", "topic": "Assignment 05: Innovation, IPR & Technology Readiness (TRL)", "expl": "Correct Answer: B) Testing and adapting design features based on user feedback"}, {"id": "incu_asg05_q06", "asg": 5, "q_num": 6, "q": "At which point in the innovation process should businesses prioritize securing Intellectual Property Rights (IPR) to protect their inventions?", "opts": {"A": "During the initial idea conception", "B": "After developing a working prototype", "C": "Before commercializing the product", "D": "Once the product is widely available in the market"}, "ans": ["C"], "ans_text": "c. Before commercializing the product", "topic": "Assignment 05: Innovation, IPR & Technology Readiness (TRL)", "expl": "Correct Answer: C) Before commercializing the product"}, {"id": "incu_asg05_q07", "asg": 5, "q_num": 7, "q": "Who is eligible to obtain licenses for Intellectual Property Rights (IPR)?", "opts": {"A": "Start-ups only", "B": "Industry professionals only", "C": "Non-Governmental Organizations (NGOs) only", "D": "All of the above"}, "ans": ["D"], "ans_text": "d. All of the above", "topic": "Assignment 05: Innovation, IPR & Technology Readiness (TRL)", "expl": "Correct Answer: D) All of the above"}, {"id": "incu_asg05_q08", "asg": 5, "q_num": 8, "q": "What does TRL stand for in the context of innovation and development?", "opts": {"A": "Technology Readiness Levels", "B": "Transition and Research Limits", "C": "Technological Resource Level", "D": "Test and Reliability Levels"}, "ans": ["A"], "ans_text": " const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const load = (k, d) => {
  try {
    const val = localStorage.getItem(k);
    return val !== null ? JSON.parse(val) : d;
  } catch (e) {
    return d;
  }
};

const save = (k, v) => {
  try {
    localStorage.setItem(k, JSON.stringify(v));
  } catch (e) {
    console.error('Storage save error', e);
  }
};

// Initialize State
let Q = load(KEY_Q, null);
if (!Q || !Array.isArray(Q) || Q.length === 0) {
  Q = DEFAULT_QUESTIONS;
  save(KEY_Q, Q);
}

let S = load(KEY_S, {});
let STARS = new Set(load(KEY_STARS, []));
let autoAdvanceEnabled = load(KEY_AUTO, true);
let autoAdvanceDelay = load(KEY_DELAY, 1200); // 1.2s default

let session = null;
let page = 'home';
let autoTimer = null;
let autoPaused = false;

// Helpers
const el = (tag, attrs = {}, ...children) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith('on') && typeof v === 'function') node[k] = v;
    else if (k === 'class') node.className = v;
    else if (k === 'style') node.style.cssText = v;
    else if (v !== null && v !== undefined && v !== false) node.setAttribute(k, v === true ? '' : v);
  }
  for (const child of children) {
    if (child === null || child === undefined || child === false) continue;
    if (Array.isArray(child)) child.forEach(c => c && node.append(c));
    else node.append(typeof child === 'string' || typeof child === 'number' ? document.createTextNode(child) : child);
  }
  return node;
};

const st = id => S[id] || { a: 0, c: 0, streak: 0, last: null, t: 0 };
const isNew = id => st(id).a === 0;
const isWeak = id => {
  const s = st(id);
  return s.a > 0 && (s.c / s.a < 0.6 || (s.a - s.c >= 2) || s.last === false);
};
const isMastered = id => {
  const s = st(id);
  return s.a >= 2 && s.streak >= 2 && (s.c / s.a >= 0.8);
};
const pct = (c, a) => a ? Math.round((c / a) * 100) : 0;
const shuffle = arr => [...arr].sort(() => Math.random() - 0.5);

const updateBadges = () => {
  const weakCount = Q.filter(x => isWeak(x.id)).length;
  const wb = $('#weakBadge');
  if (wb) {
    wb.textContent = weakCount;
    wb.style.display = weakCount ? 'inline-block' : 'none';
  }
  const sb = $('#starBadge');
  if (sb) {
    sb.textContent = STARS.size;
    sb.style.display = STARS.size ? 'inline-block' : 'none';
  }
};

const toggleStar = (id) => {
  if (STARS.has(id)) STARS.delete(id);
  else STARS.add(id);
  save(KEY_STARS, [...STARS]);
  updateBadges();
  render();
};

/* Session handling */
function startSession(mode, topic = '', countLimit = 0, autoAdvance = null) {
  if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
  autoPaused = false;
  if (autoAdvance !== null) {
    autoAdvanceEnabled = autoAdvance;
    save(KEY_AUTO, autoAdvanceEnabled);
  }

  let pool = Q.filter(x => !topic || x.topic === topic);
  if (!pool.length) {
    alert('No questions match this selection.');
    return;
  }

  if (mode === 'weak') {
    pool = pool.filter(x => isWeak(x.id)).sort((a, b) => (st(b.id).a - st(b.id).c) - (st(a.id).a - st(a.id).c));
    if (!pool.length) {
      alert('No weak questions yet in this category! Practice more questions to build your weak list.');
      return;
    }
  } else if (mode === 'new') {
    pool = shuffle(pool.filter(x => isNew(x.id)));
    if (!pool.length) {
      alert('All questions in this selection have been attempted! Try "Smart Mix" or "All Questions".');
      return;
    }
  } else if (mode === 'starred') {
    pool = pool.filter(x => STARS.has(x.id));
    if (!pool.length) {
      alert('No starred questions yet! Use the ⭐ button on any question to bookmark it.');
      return;
    }
    pool = shuffle(pool);
  } else if (mode === 'smart' || mode === 'rapid') {
    const w = shuffle(pool.filter(x => isWeak(x.id)));
    const n = shuffle(pool.filter(x => isNew(x.id)));
    const r = shuffle(pool.filter(x => !isWeak(x.id) && !isNew(x.id)));
    pool = [...w, ...n, ...r];
  } else {
    pool = shuffle(pool);
  }

  if (countLimit > 0 && pool.length > countLimit) {
    pool = pool.slice(0, countLimit);
  }

  session = {
    queue: pool.map(x => x.id),
    i: 0,
    answered: null, // null while answering; array of picked letters once submitted
    selected: new Set(), // set of chosen letters for multi-select
    results: [],
    mode,
    topic,
    startTime: Date.now()
  };
  render();
}

// Single-choice answer
function answerSingle(letter) {
  if (!session || session.answered) return;
  const q = Q.find(x => x.id === session.queue[session.i]);
  if (!q) return;

  const letterUpper = letter.toUpperCase();
  const correctKeys = Array.isArray(q.ans) ? q.ans : [q.ans];
  const ok = correctKeys.includes(letterUpper);

  session.answered = [letterUpper];
  session.results.push({ id: q.id, picked: [letterUpper], ok });

  const s = st(q.id);
  S[q.id] = {
    a: s.a + 1,
    c: s.c + (ok ? 1 : 0),
    streak: ok ? s.streak + 1 : 0,
    last: ok,
    t: Date.now()
  };
  save(KEY_S, S);
  updateBadges();
  render();

  if (autoAdvanceEnabled && !autoPaused) {
    triggerAutoAdvance();
  }
}

// Toggle multi-select option
function toggleMultiOption(letter) {
  if (!session || session.answered) return;
  const letterUpper = letter.toUpperCase();
  if (session.selected.has(letterUpper)) {
    session.selected.delete(letterUpper);
  } else {
    session.selected.add(letterUpper);
  }
  render();
}

// Submit multi-select answer
function submitMulti() {
  if (!session || session.answered || session.selected.size === 0) return;
  const q = Q.find(x => x.id === session.queue[session.i]);
  if (!q) return;

  const picked = [...session.selected].sort();
  const correctKeys = [...(Array.isArray(q.ans) ? q.ans : [q.ans])].sort();

  // Full match requirement: Must select ALL correct options and NO wrong ones!
  const ok = picked.length === correctKeys.length && picked.every((val, idx) => val === correctKeys[idx]);

  session.answered = picked;
  session.results.push({ id: q.id, picked, ok });

  const s = st(q.id);
  S[q.id] = {
    a: s.a + 1,
    c: s.c + (ok ? 1 : 0),
    streak: ok ? s.streak + 1 : 0,
    last: ok,
    t: Date.now()
  };
  save(KEY_S, S);
  updateBadges();
  render();

  if (autoAdvanceEnabled && !autoPaused) {
    triggerAutoAdvance();
  }
}

function triggerAutoAdvance() {
  if (autoTimer) clearTimeout(autoTimer);
  const fill = $('.auto-advance-fill');
  if (fill) {
    fill.style.transition = 'none';
    fill.style.width = '0%';
    requestAnimationFrame(() => {
      fill.style.transition = `width ${autoAdvanceDelay}ms linear`;
      fill.style.width = '100%';
    });
  }

  autoTimer = setTimeout(() => {
    if (!autoPaused && session && session.answered) {
      next();
    }
  }, autoAdvanceDelay);
}

function pauseAutoAdvance() {
  autoPaused = true;
  if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
  const fill = $('.auto-advance-fill');
  if (fill) fill.style.width = '0%';
  render();
}

function resumeAutoAdvance() {
  autoPaused = false;
  triggerAutoAdvance();
  render();
}

function next() {
  if (!session) return;
  if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
  autoPaused = false;
  session.i++;
  session.answered = null;
  session.selected = new Set();
  render();
}

/* Views */

  let totalA = 0, totalC = 0;

    el('div', { class: 'stat' }, el('b', {}, `${attempted}/${total}`), el('span', {}, 'Attempted')),
    el('div', { class: 'stat' }, el('b', { class: 'pct' }, `${pct(totalC, totalA)}%`), el('span', {}, 'Overall Accuracy'))

  v.append(statsGrid);

  // Practice Card
  const topics = [...new Set(Q.map(x => x.topic))].sort();
  const selTopic = el('select', { id: 'selTopic', style: 'flex:1;min-width:200px' },

      return el('option', { value: t }, `${t} (${cnt} Qs)`);
    })

  const selCount = el('select', { id: 'selCount', style: 'width:140px' },
    el('option', { value: '0' }, 'All available'),
    el('option', { value: '10' }, '10 Questions'),
    el('option', { value: '20' }, '20 Questions'),
    el('option', { value: '5' }, '5 Quick Qs')
  );

  const selDelay = el('select', { id: 'selDelay', style: 'width:125px' },
    el('option', { value: '800', ...(autoAdvanceDelay === 800 ? { selected: true } : {}) }, '0.8s (Fast)'),
    el('option', { value: '1200', ...(autoAdvanceDelay === 1200 ? { selected: true } : {}) }, '1.2s (Normal)'),
    el('option', { value: '2000', ...(autoAdvanceDelay === 2000 ? { selected: true } : {}) }, '2.0s (Relaxed)')
  );
  selDelay.onchange = () => {
    autoAdvanceDelay = parseInt(selDelay.value, 10);
    save(KEY_DELAY, autoAdvanceDelay);
  };

  const getParams = () => ({
    topic: selTopic.value,
    count: parseInt(selCount.value, 10) || 0
  });

  const practiceCard = el('div', { class: 'card' },
    el('div', { style: 'display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px' },
      el('b', { style: 'font-size:17px' }, 'Start Practice Session'),
      el('div', { class: 'row', style: 'gap:8px' },
        el('label', { class: 'toggle-switch', title: 'Automatically move to next question after picking an answer' },
          el('input', {
            type: 'checkbox',
            checked: autoAdvanceEnabled,
            onchange: e => {
              autoAdvanceEnabled = e.target.checked;
              save(KEY_AUTO, autoAdvanceEnabled);
            }
          }),
          el('div', { class: 'toggle-track' }, el('div', { class: 'toggle-thumb' })),
          el('span', { style: 'font-weight:600' }, '⏱️ Auto-advance')
        ),
        selDelay
      )
    ),

    const missed = results.filter(x => !x.ok);

    let congratText = 'Keep revising to master these concepts!';
    if (scorePct === 100) congratText = '🌟 Perfect Score! Flawless recall on all questions!';
    else if (scorePct >= 80) congratText = '🎉 Excellent Performance! Solid understanding of the material!';
    else if (scorePct >= 60) congratText = '👍 Good attempt! Review the missed questions below to strengthen recall.';

    const finishCard = el('div', { class: 'card', style: 'text-align:center;padding:30px 20px' },
      el('h2', { style: 'margin:0 0 6px' }, 'Session Completed'),

      ),

              answered: null,
              selected: new Set(),
              results: [],
              mode: 'retry',
              topic: session.topic,
              startTime: Date.now()

          }
        }, `🔄 Retry Missed (${missed.length})`) : null,

        }, '🔁 Practice Again'),

            const correctText = correctKeys.map(k => `${k}) ${q.opts[k] || ''}`).join('; ');
            const pickedArr = Array.isArray(m.picked) ? m.picked : [m.picked];
            const pickedText = pickedArr.length ? pickedArr.map(k => `${k}) ${q.opts[k] || ''}`).join('; ') : 'None';

        el('button', {
          class: 'btn-sm',
          title: 'Quit session',

              render();

    ),

    // Progress Bar
    el('div', { class: 'bar' }, el('i', { style: `width: ${progressPct}%` })),

    el('div', { class: 'q' }, q.q),

      ...Object.keys(q.opts).sort().map(k => {

          }

          const isTarget = correctKeys.includes(k);

          if (isTarget && isUserPicked) {
            cls += ' right';
            iconText = '✓ Correct';
          } else if (!isTarget && isUserPicked) {
            cls += ' wrong';
            iconText = '✗ Wrong';
          } else if (isTarget && !isUserPicked) {
            cls += ' missed';
            iconText = 'Missed';
          }
        }

        return el('button', {
          class: cls,
          onclick: () => {
            if (ans) return;
            if (isMulti) {
              toggleMultiOption(k);
            } else {
              answerSingle(k);
            }
          },
          ...(ans ? { disabled: true } : {})
        },
          isMulti ? el('span', { class: 'chkbox' }, ans ? (correctKeys.includes(k) ? '✓' : (ans.includes(k) ? '✗' : '')) : (isSelectedBeforeSubmit ? '✓' : '')) : null,

      el('button', {
        class: 'primary',

    ) : null,

    // Explanation & Result banner (shown after answering)
    ans ? el('div', { class: 'expl' },

    // Bottom Action Row
    el('div', { class: 'row', style: 'justify-content:space-between;margin-top:18px' },
      el('div', { class: 'mute', style: 'font-size:13px' },
        st(q.id).a > 0 ? `Your stats: ${st(q.id).c}/${st(q.id).a} correct` : 'First attempt'

      ans ? el('button', {
        id: 'nextBtn',

  return v;

function parseTextQuestions(text) {
  const out = [];
  const errors = [];
  let cur = null;

  const flush = () => {
    if (!cur) return;
    const keys = Object.keys(cur.opts);
    if (!cur.q || keys.length < 2 || !cur.ans.length) {
      errors.push(`Skipped question: "${(cur.q || '').slice(0, 50)}..." (requires text, at least 2 options, and valid answer)`);
    } else {
      const simpleId = 'custom_' + Math.random().toString(36).substr(2, 9);
      out.push({
        id: simpleId,
        q: cur.q.trim(),
        opts: cur.opts,
        ans: cur.ans,
        topic: (cur.topic || 'General Innovation').trim(),
        expl: (cur.expl || '').trim()
      });
    }
    cur = null;
  };

  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    if (!line) continue;

    let m;
    if (m = line.match(/^(?:Q\s*\d*\s*[:.)]|\d+\s*[.)])\s*(.*)$/i)) {
      flush();
      cur = { q: m[1], opts: {}, ans: [], topic: 'General Innovation', expl: '' };
    } else if (!cur) {
      continue;
    } else if (m = line.match(/^\(?([A-F])[.)]\s*(.*)$/i)) {
      const k = m[1].toUpperCase();
      cur.opts[k] = m[2];
    } else if (m = line.match(/^ans(?:wer)?\s*[:\-]\s*(.*)$/i)) {
      const rawAns = m[1].toUpperCase();
      const letters = rawAns.match(/[A-F]/g);
      if (letters) cur.ans = letters;
    } else if (m = line.match(/^topic\s*[:\-]\s*(.*)$/i)) {
      cur.topic = m[1];
    } else if (m = line.match(/^(?:detailed solution|explanation|expl)\s*[:\-]\s*(.*)$/i)) {
      cur.expl = m[1];
    } else if (cur && !Object.keys(cur.opts).length && !cur.ans.length) {
      cur.q += ' ' + line;
    }
  }
  flush();
  return { out, errors };
}

function addQuestions(list) {
  const have = new Set(Q.map(x => x.q.toLowerCase().trim()));
  let added = 0;
  for (const x of list) {
    if (!have.has(x.q.toLowerCase().trim())) {
      Q.push(x);
      have.add(x.q.toLowerCase().trim());
      added++;
    }
  }
  save(KEY_Q, Q);
  return added;
}

function viewManage() {
  const v = el('div');

  const ta = el('textarea', {
    placeholder: `Q: What makes an idea valuable even if it fails?\nA) Avoiding collaboration\nB) Gaining valuable lessons and insights\nC) Shifting focus immediately\nD) Disregarding accountability\nAnswer: B\nTopic: Assignment 01: Idea Valuation & Lean Startup Fundamentals\nExplanation: Failures provide essential learning for future iterations.`
  });
  const msg = el('div', { class: 'mute', style: 'margin-top:8px;font-size:13.5px;white-space:pre-wrap' });

  const addCard = el('div', { class: 'card' },
    el('b', { style: 'font-size:17px' }, 'Add Custom Questions'),
    el('p', { class: 'mute', style: 'margin:4px 0 10px;font-size:13px' },
      'Paste questions in standard format shown. Multiple questions can be separated by blank lines.'
    ),
    ta,
    el('div', { class: 'row', style: 'margin-top:10px' },
      el('button', {
        class: 'primary',
        onclick: () => {
          const { out, errors } = parseTextQuestions(ta.value);
          const added = addQuestions(out);
          msg.textContent = `Successfully added ${added} question(s).` +
            (out.length - added > 0 ? ` (${out.length - added} duplicate(s) skipped)` : '') +
            (errors.length ? '\n' + errors.join('\n') : '');
          if (added) {
            ta.value = '';
            render();
          }
        }
      }, '➕ Parse & Add Questions'),
      el('button', {
        onclick: () => { ta.value = ''; msg.textContent = ''; }
      }, 'Clear Input')
    ),
    msg
  );
  v.append(addCard);

  // Backup & Storage Management Card
  const fileInput = el('input', {
    type: 'file',
    accept: '.json',
    style: 'display:none',
    onchange: e => {
      const f = e.target.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (Array.isArray(data)) {
            Q = data;
          } else if (data.Q && Array.isArray(data.Q)) {
            Q = data.Q;
            if (data.S) S = data.S;
            if (data.STARS) STARS = new Set(data.STARS);
          } else {
            throw new Error('Unrecognized JSON format');
          }
          save(KEY_Q, Q);
          save(KEY_S, S);
          save(KEY_STARS, [...STARS]);
          alert(`Successfully imported ${Q.length} questions!`);
          render();
        } catch (err) {
          alert('Error importing JSON: ' + err.message);
        }
      };
      reader.readAsText(f);
    }
  });

  const storageCard = el('div', { class: 'card' },
    el('b', { style: 'font-size:17px' }, 'Data Backup & Reset'),
    el('p', { class: 'mute', style: 'margin:4px 0 12px;font-size:13px' },
      'Export question bank and practice history to a JSON file, or restore default course content.'
    ),
    fileInput,
    el('div', { class: 'row' },
      el('button', {
        onclick: () => {
          const blob = new Blob([JSON.stringify({ Q, S, STARS: [...STARS] }, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = el('a', { href: url, download: 'incu-quiz-backup.json' });
          a.click();
          URL.revokeObjectURL(url);
        }
      }, '📥 Export Backup (JSON)'),
      el('button', {
        onclick: () => fileInput.click()
      }, '📤 Import Backup (JSON)'),
      el('button', {
        class: 'danger',
        onclick: () => {
          if (confirm('Reset all scores, attempts, and streaks? (Questions will not be deleted)')) {
            S = {};
            save(KEY_S, S);
            render();
          }
        }
      }, '🔄 Reset Scores'),
      el('button', {
        class: 'danger',
        onclick: () => {
          if (confirm('Restore the original 120 Innovation & Incubation questions?')) {
            Q = DEFAULT_QUESTIONS;
            save(KEY_Q, Q);
            render();
          }
        }
      }, '♻️ Restore Default 120 Questions')
    )
  );
  v.append(storageCard);

  // Question Explorer Card
  const searchInput = el('input', {
    type: 'search',
    placeholder: 'Search questions by keyword...',
    style: 'flex:1;min-width:220px'
  });

  const qListContainer = el('div', { style: 'margin-top:14px;display:flex;flex-direction:column;gap:10px' });

  const renderQuestionList = (filter = '') => {
    qListContainer.replaceChildren();
    const query = filter.toLowerCase().trim();
    const filtered = Q.filter(x => !query || x.q.toLowerCase().includes(query) || x.topic.toLowerCase().includes(query));

    if (!filtered.length) {
      qListContainer.append(el('div', { class: 'mute', style: 'padding:14px;text-align:center' }, 'No questions match your search.'));
      return;
    }

    filtered.slice(0, 50).forEach(x => {
      const correctKeys = Array.isArray(x.ans) ? x.ans : [x.ans];
      const qRow = el('div', {
        style: 'padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);display:flex;justify-content:space-between;align-items:flex-start;gap:12px'
      },
        el('div', { style: 'flex:1' },
          el('div', { style: 'margin-bottom:4px' },
            el('span', { class: 'tag topic' }, x.topic),
            el('span', { class: 'tag ok', style: 'margin-left:4px' }, `Ans: ${correctKeys.join(', ')}`)
          ),
          el('div', { style: 'font-weight:600;font-size:14.5px' }, x.q)
        ),
        el('button', {
          class: 'btn-sm danger',
          title: 'Delete this question',
          onclick: () => {
            if (confirm(`Delete this question?\n\n"${x.q.slice(0, 60)}..."`)) {
              Q = Q.filter(item => item.id !== x.id);
              save(KEY_Q, Q);
              renderQuestionList(searchInput.value);
            }
          }
        }, '🗑 Delete')
      );
      qListContainer.append(qRow);
    });

    if (filtered.length > 50) {
      qListContainer.append(el('div', { class: 'mute', style: 'text-align:center;font-size:13px;padding:8px' }, `Showing first 50 of ${filtered.length} questions.`));
    }
  };

  searchInput.oninput = () => renderQuestionList(searchInput.value);

  const explorerCard = el('div', { class: 'card' },
    el('div', { style: 'display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px' },
      el('b', { style: 'font-size:17px' }, `All Questions Bank (${Q.length})`),
      searchInput
    ),
    qListContainer
  );
  v.append(explorerCard);

  renderQuestionList();
  return v;
}

/* Page Navigation */
function go(p) {
  if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
  page = p;
  session = null;
  $$('nav button.nav-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.go === p);
  });
  render();
}

function render() {
  const root = $('#view');
  root.replaceChildren();

  if (session) {
    root.append(viewQuiz());
  } else if (page === 'weak') {
    root.append(viewWeak());
  } else if (page === 'starred') {
    root.append(viewStarred());
  } else if (page === 'manage') {
    root.append(viewManage());
  } else {
    root.append(viewHome());
  }

  updateBadges();
  window.scrollTo(0, 0);

  const nb = $('#nextBtn');
  if (nb && !autoAdvanceEnabled) nb.focus();
}

/* Theme Management */
function initTheme() {
  const currentTheme = localStorage.getItem(KEY_THEME) || 'auto';
  applyTheme(currentTheme);

  $('#themeToggle').onclick = () => {
    const cur = document.documentElement.getAttribute('data-theme') || 'auto';
    let nextTheme = 'light';
    if (cur === 'light') nextTheme = 'dark';
    else if (cur === 'dark') nextTheme = 'auto';
    else nextTheme = 'light';

    applyTheme(nextTheme);
  };
}

function applyTheme(t) {
  if (t === 'auto') {
    document.documentElement.removeAttribute('data-theme');
    $('#themeToggle').textContent = '🌓';
  } else {
    document.documentElement.setAttribute('data-theme', t);
    $('#themeToggle').textContent = t === 'dark' ? '🌙' : '☀️';
  }
  localStorage.setItem(KEY_THEME, t);
}

/* Keyboard Navigation */
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  if (session) {
    const k = e.key.toUpperCase();
    const q = Q.find(x => x.id === session.queue[session.i]);
    if (!q) return;
    const isMulti = (Array.isArray(q.ans) ? q.ans : [q.ans]).length > 1;

    if (!session.answered) {
      if (q.opts[k]) {
        e.preventDefault();
        if (isMulti) {
          toggleMultiOption(k);
        } else {
          answerSingle(k);
        }
      } else if (k === '1' && q.opts['A']) {
        if (isMulti) toggleMultiOption('A'); else answerSingle('A');
      } else if (k === '2' && q.opts['B']) {
        if (isMulti) toggleMultiOption('B'); else answerSingle('B');
      } else if (k === '3' && q.opts['C']) {
        if (isMulti) toggleMultiOption('C'); else answerSingle('C');
      } else if (k === '4' && q.opts['D']) {
        if (isMulti) toggleMultiOption('D'); else answerSingle('D');
      } else if (isMulti && e.key === 'Enter') {
        e.preventDefault();
        submitMulti();
      } else if (k === 'S' || k === 'B') {
        toggleStar(q.id);
      }
    } else {
      if (e.key === ' ' || e.code === 'Space') {
        e.preventDefault();
        if (autoPaused) resumeAutoAdvance();
        else pauseAutoAdvance();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        next();
      } else if (k === 'S' || k === 'B') {
        toggleStar(q.id);
      }
    }
  }
});

// Setup nav handlers
$$('nav [data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));

// Initial boot
initTheme();
go('home');
</script>
